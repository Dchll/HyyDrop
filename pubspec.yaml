name: hyy_drop
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # https://pub.dev/packages/cupertino_icons
  cupertino_icons: ^1.0.8

  # https://pub.dev/packages/hooks_riverpod
  hooks_riverpod: ^3.1.0

  # https://pub.dev/packages/flutter_hooks
  flutter_hooks: ^0.21.3+1

  # https://pub.dev/packages/riverpod_annotation
  riverpod_annotation: ^4.0.0

  # https://pub.dev/packages/auto_route
  auto_route: ^11.1.0

  # https://pub.dev/packages/path_provider
  path_provider: ^2.1.5

  # https://pub.dev/packages/hive
  hive: ^2.2.3

  # https://pub.dev/packages/package_info_plus
  package_info_plus: ^9.0.0

  # https://pub.dev/packages/device_info_plus
  device_info_plus: ^12.3.0

  # https://pub.dev/packages/talker
  talker: ^5.1.15

  # https://pub.dev/packages/talker_riverpod_logger
  talker_riverpod_logger: ^5.1.14

  # https://pub.dev/packages/intl
  intl: ^0.20.2
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0

  # https://pub.dev/packages/riverpod_generator
  riverpod_generator: ^4.0.0+1

  # https://pub.dev/packages/build_runner
  build_runner: ^2.13.1

  # https://pub.dev/packages/auto_route_generator
  auto_route_generator: ^10.4.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans VF.ttf
